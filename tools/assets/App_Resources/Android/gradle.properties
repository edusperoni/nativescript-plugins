## @nativescript/sqlite — see the plugin README for the full list.

## Binding backend: napi (default) | v8
# nscsqlite.backend=napi

## SQLite build: bundled (default) | sqlite3mc
# nscsqlite.sqlite=sqlite3mc

## Extra compile definitions for the selected preset, separated by ';'.
# nscsqlite.sqliteFlags=SQLITE_ENABLE_RTREE;SQLITE_DQS=0

## A directory whose CMakeLists.txt defines the target `nscsqlite_sqlite`.
## Relative paths are resolved against the app root. Leave this unset and put
## the directory at App_Resources/Android/nscsqlite instead to have it picked up
## by convention. Either one replaces nscsqlite.sqlite, which must then be unset.
# nscsqlite.sqliteProjectDir=../../plugins/sqlite-engine
