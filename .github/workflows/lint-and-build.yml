name: Lint, Build and Test (PR)

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint affected projects
    runs-on: ubuntu-latest
    outputs:
      demo-affected: ${{ steps.affected.outputs.demo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'
      - name: yarn install
        run: yarn
      - name: Lint affected
        run: yarn nx affected:lint
      # The device tests live in the demo app, which depends on every package.
      - name: Check whether the demo app is affected
        id: affected
        run: |
          if yarn -s nx show projects --affected --projects=demo | grep -qx demo; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build affected projects
    needs: lint
    # TODO: change this once we need native builds for iOS
    # runs-on: macos-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'
      - name: yarn install
        run: yarn
      - name: Build.all affected
        run: yarn nx affected --target=build.all

  test-android:
    name: Test (Android emulator)
    needs: lint
    if: needs.lint.outputs.demo-affected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: yarn install
        run: yarn
      - name: Install NativeScript CLI
        run: |
          npm install -g nativescript@9
          ns usage-reporting disable
          ns error-reporting disable
      # If the app crashes on launch, karma never sees a browser and waits forever.
      - name: Run tests
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: yarn nx run demo:test:android --device=emulator-5554 --silent

  test-ios:
    name: Test (iOS simulator)
    needs: lint
    if: needs.lint.outputs.demo-affected == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - name: yarn install
        run: yarn
      - name: Install NativeScript CLI
        run: |
          npm install -g nativescript@9
          ns usage-reporting disable
          ns error-reporting disable
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          # Newest installed iOS runtime, first iPhone on it
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains(".iOS-")))
            | sort_by(.key | [scan("[0-9]+") | tonumber])
            | last | .value
            | map(select(.name | startswith("iPhone")))
            | first | .udid')
          [ -n "$udid" ] && [ "$udid" != "null" ] || { xcrun simctl list devices available; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run tests
        timeout-minutes: 30
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: yarn nx run demo:test:ios --device="$SIMULATOR" --silent
