// Every option also reads an environment variable, because the NativeScript CLI
// forwards only one -P reliably and Gradle refuses dotted property names from
// the environment.  Precedence: -P property, environment, default.
def prop = { String name, String env, String fallback = null ->
    def value = project.hasProperty(name) ? project.property(name).toString().trim() : null
    if ((value == null || value.isEmpty()) && env != null) {
        value = System.getenv(env)?.trim()
    }
    (value == null || value.isEmpty()) ? fallback : value
}

def backend = prop('nscsqlite.backend', 'NSCSQLITE_BACKEND', 'napi')

if (backend != 'v8' && backend != 'napi') {
    throw new GradleException("nscsqlite.backend must be 'v8' or 'napi', got '${backend}'")
}

def sqlite = prop('nscsqlite.sqlite', 'NSCSQLITE_SQLITE',
                  prop('nscsqlite.sqliteImpl', null))
def sqliteExplicit = sqlite != null
if (!sqliteExplicit) {
    sqlite = 'bundled'
}

if (sqlite == 'sqlcipher') {
    throw new GradleException(
        "nscsqlite.sqlite=sqlcipher has been removed. Use nscsqlite.sqlite=sqlite3mc: it " +
        "reads and writes SQLCipher 4 databases through the same encryptionKey options, " +
        "and needs no OpenSSL. See 'Choosing the SQLite build' in the @nativescript/sqlite " +
        "README. To keep SQLCipher itself, build it through nscsqlite.sqliteProjectDir " +
        "('Bringing your own SQLite').")
}

if (sqlite == 'custom') {
    throw new GradleException(
        "nscsqlite.sqlite=custom has been removed, together with nscsqlite.sqliteIncludeDir, " +
        "nscsqlite.sqliteLibDir and nscsqlite.sqliteLibName. Point nscsqlite.sqliteProjectDir " +
        "at a directory whose CMakeLists.txt defines a target named 'nscsqlite_sqlite'; an " +
        "IMPORTED target wraps a prebuilt library in five lines. See 'Bringing your own " +
        "SQLite' in the @nativescript/sqlite README.")
}

if (sqlite != 'bundled' && sqlite != 'sqlite3mc') {
    throw new GradleException(
        "nscsqlite.sqlite must be 'bundled' or 'sqlite3mc', got '${sqlite}'")
}

def sqliteFlags = prop('nscsqlite.sqliteFlags', 'NSCSQLITE_SQLITE_FLAGS', '')

def pluginNativeDir = new File(buildscript.sourceFile.parentFile, "native")

// The directory holding the app's package.json; a relative sqliteProjectDir is
// read from there, the way nsconfig paths are.
def appRoot = project.hasProperty('USER_PROJECT_ROOT')
              ? new File(project.property('USER_PROJECT_ROOT').toString())
              : project.rootProject.projectDir

// An app-provided CMake directory, either named outright or found at the
// convention location.  Either one replaces the preset entirely.
def sqliteProjectDir = null
def sqliteProjectOrigin = null

def sqliteProjectProp = prop('nscsqlite.sqliteProjectDir', 'NSCSQLITE_SQLITE_PROJECT_DIR')
if (sqliteProjectProp != null) {
    def dir = new File(sqliteProjectProp)
    sqliteProjectDir = (dir.isAbsolute() ? dir : new File(appRoot, sqliteProjectProp))
                       .canonicalFile
    sqliteProjectOrigin = "nscsqlite.sqliteProjectDir=${sqliteProjectProp}"
    if (!new File(sqliteProjectDir, 'CMakeLists.txt').exists()) {
        throw new GradleException(
            "${sqliteProjectOrigin} resolves to '${sqliteProjectDir}', which contains no " +
            "CMakeLists.txt. A relative path is resolved against the app root " +
            "('${appRoot}').")
    }
} else if (project.hasProperty('getAppResourcesPath')) {
    // The app template's no-argument closure on the root project; the
    // one-argument one in gradle-helpers/paths.gradle is shadowed by it.
    def appResources = project.property('getAppResourcesPath')().toString()
    def conventional = new File(appResources, 'Android/nscsqlite')
    if (new File(conventional, 'CMakeLists.txt').exists()) {
        sqliteProjectDir = conventional.canonicalFile
        sqliteProjectOrigin = "App_Resources/Android/nscsqlite"
    }
}

if (sqliteProjectDir != null && sqliteExplicit) {
    throw new GradleException(
        "nscsqlite: an app-provided SQLite build (${sqliteProjectOrigin}) and the preset " +
        "nscsqlite.sqlite=${sqlite} are both configured, and they select different SQLite " +
        "engines. Remove one of them: drop nscsqlite.sqlite to build the app-provided " +
        "directory, or remove that directory (or unset nscsqlite.sqliteProjectDir) to build " +
        "the preset.")
}

def sha256Of(File file) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().collect { String.format("%02x", it) }.join()
}

def downloadTo(String url, File target) {
    def part = new File(target.parentFile, "${target.name}.${UUID.randomUUID()}.part")
    part.parentFile.mkdirs()

    def connection = new java.net.URL(url).openConnection()
    connection.instanceFollowRedirects = true
    connection.connectTimeout = 30000
    connection.readTimeout = 300000
    connection.inputStream.withStream { input ->
        part.withOutputStream { output -> output << input }
    }

    java.nio.file.Files.move(part.toPath(), target.toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}

// Resolves one artifact pinned in native/downloads.properties to its extracted
// directory, downloading and caching it on first use.
//
// Runs at configuration time because the resolved path has to be part of the
// app's externalNativeBuild CMake arguments, which are read while the variant
// is configured.  Everything after the first build is a single file-exists
// check.
def resolveArtifact(project, File cacheRoot, Properties pins, String name) {
    def id = pins.getProperty("${name}.id")
    def marker = pins.getProperty("${name}.marker")
    def artifactCache = new File(cacheRoot, name)
    def targetDir = new File(artifactCache, id)
    if (new File(targetDir, marker).exists()) {
        return targetDir
    }

    def url = pins.getProperty("${name}.url")
    def expectedSha = pins.getProperty("${name}.sha256")
    def archive = new File(artifactCache, url.substring(url.lastIndexOf('/') + 1))

    if (!archive.exists() || sha256Of(archive) != expectedSha) {
        project.logger.lifecycle("[nscsqlite] Downloading ${name} ${id}")
        downloadTo(url, archive)
    }

    def actualSha = sha256Of(archive)
    if (actualSha != expectedSha) {
        archive.delete()
        throw new GradleException(
            "[nscsqlite] ${archive.name} failed checksum verification (expected " +
            "${expectedSha}, got ${actualSha}); the download was discarded. It was fetched " +
            "from ${url}, pinned in native/downloads.properties.")
    }

    def tree = pins.getProperty("${name}.archive") == 'zip'
               ? project.zipTree(archive)
               : project.tarTree(project.resources.gzip(archive))
    def pattern = pins.getProperty("${name}.include")
    def strip = (pins.getProperty("${name}.strip") ?: '0') as int

    // Extract to a private directory and move it into place, so a killed build
    // can never leave a half-populated cache entry behind.
    def stagingDir = new File(artifactCache, "${id}.tmp-${UUID.randomUUID()}")
    project.copy {
        from(tree) {
            if (pattern) {
                include pattern
            }
            includeEmptyDirs = false
            if (strip > 0) {
                eachFile { details ->
                    details.relativePath = new org.gradle.api.file.RelativePath(
                        true, details.relativePath.segments.drop(strip) as String[])
                }
            }
        }
        into stagingDir
    }

    project.delete(targetDir)
    try {
        java.nio.file.Files.move(stagingDir.toPath(), targetDir.toPath())
    } catch (java.io.IOException e) {
        project.delete(stagingDir)
        if (!new File(targetDir, marker).exists()) {
            throw new GradleException(
                "[nscsqlite] Failed to populate the ${name} cache at ${targetDir}", e)
        }
    }

    return targetDir
}

def downloadPins = new Properties()
new File(pluginNativeDir, "downloads.properties").withInputStream { downloadPins.load(it) }

def cacheRoot = new File(prop('nscsqlite.cacheDir', 'NSCSQLITE_CACHE_DIR')
                         ?: new File(project.gradle.gradleUserHomeDir, "nscsqlite").path)

def v8IncludeDir = null
if (backend == 'v8') {
    def override = prop('nscsqlite.v8IncludeDir', 'NSCSQLITE_V8_INCLUDE_DIR')
    if (override != null) {
        v8IncludeDir = new File(override)
        if (!new File(v8IncludeDir, "v8.h").exists()) {
            throw new GradleException(
                "nscsqlite.v8IncludeDir=${v8IncludeDir} does not contain v8.h")
        }
    } else {
        v8IncludeDir = new File(
            resolveArtifact(project, cacheRoot, downloadPins, 'v8-headers'), "include")
    }
}

def sqliteSourceDir = null
if (sqliteProjectDir == null) {
    def override = prop('nscsqlite.sqliteSourceDir', 'NSCSQLITE_SQLITE_SOURCE_DIR')
    if (override != null) {
        sqliteSourceDir = new File(override)
        if (!sqliteSourceDir.isDirectory()) {
            throw new GradleException(
                "nscsqlite.sqliteSourceDir=${sqliteSourceDir} is not a directory")
        }
    } else {
        sqliteSourceDir = resolveArtifact(project, cacheRoot, downloadPins,
                                          sqlite == 'bundled' ? 'sqlite' : sqlite)
    }
}

def findNsAndroidDir(project) {
    def dir = project.rootProject.projectDir
    while (dir != null) {
        def candidate = new File(dir, "node_modules/@nativescript/android/framework")
        if (candidate.exists()) return candidate.parentFile
        dir = dir.parentFile
    }
    return null
}

def nsStubsDir = null
def nsAndroidDir = findNsAndroidDir(project)
if (nsAndroidDir) {
    // Any runtime flavor exports the public V8 API, and the stub is only ever a
    // link-time input, so prefer the smallest one that is present.
    def runtimeLibsDir = new File(nsAndroidDir, "framework/app/libs/runtime-libs")
    def aarFile = ['nativescript-optimized.aar',
                   'nativescript-optimized-with-inspector.aar',
                   'nativescript-regular.aar']
        .collect { new File(runtimeLibsDir, it) }
        .find { it.exists() }
    if (aarFile != null) {
        def extractDir = new File(project.buildDir, "ns-stubs")
        def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
        def allExist = abis.every { abi ->
            new File(extractDir, "${abi}/libNativeScript.so").exists()
        }
        if (!allExist) {
            def zipFile = new java.util.zip.ZipFile(aarFile)
            try {
                abis.each { abi ->
                    def entry = zipFile.getEntry("jni/${abi}/libNativeScript.so")
                    if (entry) {
                        def outDir = new File(extractDir, abi)
                        outDir.mkdirs()
                        def outFile = new File(outDir, "libNativeScript.so")
                        def inStream = zipFile.getInputStream(entry)
                        outFile.bytes = inStream.bytes
                        inStream.close()
                    }
                }
            } finally {
                zipFile.close()
            }
        }
        nsStubsDir = extractDir.absolutePath
    }
}

def cmakeArgs = [
    "-DNSCSQLITE_BACKEND=${backend}",
    "-DNSCSQLITE_SQLITE=${sqliteProjectDir != null ? 'project' : sqlite}",
    "-DNSCSQLITE_SQLITE_FLAGS=${sqliteFlags}"
]

if (sqliteProjectDir != null) {
    cmakeArgs << "-DNSCSQLITE_SQLITE_PROJECT_DIR=${sqliteProjectDir.absolutePath}"
} else {
    cmakeArgs << "-DNSCSQLITE_SQLITE_SOURCE_DIR=${sqliteSourceDir.absolutePath}"
}

if (v8IncludeDir) {
    cmakeArgs << "-DV8_INCLUDE_DIR=${v8IncludeDir.absolutePath}"
}

if (nsStubsDir) {
    cmakeArgs << "-DNS_LIBS_DIR=${nsStubsDir}"
}

android {
    externalNativeBuild {
        cmake {
            path new File(buildscript.sourceFile.parentFile, "native/CMakeLists.txt").absolutePath
        }
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments(*cmakeArgs)
            }
        }
    }

    // The napi backend takes its Node-API headers from the runtime AAR's
    // header-only Prefab package.
    if (backend == 'napi') {
        buildFeatures {
            prefab true
        }
    }
}
