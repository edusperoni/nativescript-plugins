# Third-party archives include.gradle fetches into the build cache instead of
# vendoring them.  Each entry is pinned by URL and SHA-256; the checksum is
# verified before anything is extracted.
#
#   <name>.id       cache directory name, and what an upgrade must change
#   <name>.marker   file that proves an extracted cache entry is complete
#   <name>.include  Ant pattern limiting what is extracted (optional)
#   <name>.strip    leading path segments dropped from every entry

# Public V8 headers the plugin compiles against.  They must match the V8
# version embedded in @nativescript/android.  Public headers are
# ABI-independent, so a single ABI's asset is enough.
v8-headers.url=https://github.com/NativeScript/v8-buildscripts/releases/download/v8-14.9.207.39-6/v8-14.9.207.39-android-arm64-v8a.tar.gz
v8-headers.id=v8-14.9.207.39-6
v8-headers.sha256=107f91344015b2859d8feaa894ff3d2eb3644923992f8e0bbf375cbcfbc2da34
v8-headers.archive=tar.gz
v8-headers.marker=include/v8.h
v8-headers.include=*/include/**
v8-headers.strip=1

